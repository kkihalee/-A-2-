<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>말결</title>
  <!-- 글꼴: Pretendard (코딩 레퍼런스 2장) · 못 불러오면 기본 글꼴 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css?v=20261006-2">
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <!-- 화면 문구는 data/cards.json에서 채운다. data-copy="경로" → cards.json의 그 값이 글자로 들어간다. -->
  <header class="topbar">
    <button type="button" class="logo" id="go-home">말결</button>
    <button type="button" class="link-button" id="go-profile" data-copy="uiCopy.myToneTitle"></button>
  </header>

  <!-- cards.json을 못 불러왔을 때만 보인다 (파일을 더블클릭해 열면 브라우저가 막는다) -->
  <main class="screen load-error" id="load-error" hidden>
    <h1>화면을 불러오지 못했어요</h1>
    <p>카드 데이터(<code>data/cards.json</code>)를 읽지 못했어요.</p>
    <p>index.html을 더블클릭해서 열면 브라우저가 파일 읽기를 막아요. README의 <strong>‘내 PC에서 확인하기’</strong>대로 로컬 서버로 열어 주세요.</p>
  </main>

  <!-- 화면 1 · 홈 -->
  <main class="screen" id="screen-home" hidden>
    <div class="banner" id="profile-banner" hidden>
      <button type="button" class="banner-main" id="banner-setup" data-copy="uiCopy.homeBanner"></button>
      <button type="button" class="banner-skip" id="banner-skip" data-copy="uiCopy.skip"></button>
    </div>

    <h1 data-copy="uiCopy.homeTitle"></h1>

    <div class="cards" id="card-list"></div>

    <label class="input-label" for="home-input" data-copy="uiCopy.oneLineLabel"></label>
    <textarea id="home-input" rows="3"></textarea>
    <p class="security-note" data-copy="uiCopy.confidentialNotice"></p>

    <button type="button" class="primary" id="home-submit" disabled data-copy="uiCopy.buttons.organize"></button>
  </main>

  <!-- 화면 2 · 구조화 확인 -->
  <main class="screen" id="screen-structure" hidden>
    <h1 data-copy="uiCopy.structureTitle"></h1>
    <p class="summary"><strong id="structure-card"></strong> · <span id="structure-input"></span></p>

    <section class="block">
      <h2 class="block-title"><span data-copy="uiCopy.partnerLabel"></span> <span class="required">*</span></h2>
      <div class="chips" id="recipient-list"></div>
    </section>

    <section class="block">
      <h2 class="block-title" data-copy="uiCopy.fieldsLabel"></h2>
      <p class="block-desc" data-copy="uiCopy.fieldsHint"></p>
      <div id="field-list"></div>
      <p class="security-note" data-copy="uiCopy.confidentialNotice"></p>
    </section>

    <div class="actions">
      <button type="button" class="secondary" data-go="home" data-copy="uiCopy.buttons.home"></button>
      <button type="button" class="primary" id="make-message" disabled data-copy="uiCopy.buttons.makeMessage"></button>
    </div>
  </main>

  <!-- 화면 3 · 결과 -->
  <main class="screen" id="screen-result" hidden>
    <h1 data-copy="uiCopy.resultTitle"></h1>
    <p class="summary"><strong id="result-card"></strong> · <span data-copy="uiCopy.partnerLabel"></span> <span id="result-recipient"></span></p>

    <div class="tabs" id="variant-tabs" role="tablist" aria-label="메시지 종류"></div>
    <textarea id="message-text" rows="9" aria-label="메시지 본문"></textarea>

    <section class="block">
      <h2 class="block-title" data-copy="uiCopy.intentCheckTitle"></h2>
      <p class="block-desc" data-copy="uiCopy.intentCheckDesc"></p>
      <ul class="check-list" id="intent-list"></ul>
    </section>

    <section class="block">
      <h2 class="block-title" data-copy="uiCopy.reasonTitle"></h2>
      <ul class="reason-list" id="reason-list"></ul>
    </section>

    <div class="result-actions">
      <button type="button" class="primary" id="copy-message" data-copy="uiCopy.buttons.copy"></button>
      <button type="button" class="secondary" id="regenerate" data-copy="uiCopy.buttons.regenerate"></button>
      <button type="button" class="secondary" id="save-preferred" data-copy="uiCopy.buttons.applyToMyTone"></button>
      <button type="button" class="secondary" data-go="structure" data-copy="uiCopy.buttons.editStructure"></button>
    </div>
    <p class="toast" id="result-toast" aria-live="polite"></p>
  </main>

  <!-- 화면 4 · 내 말투 -->
  <main class="screen" id="screen-profile" hidden>
    <h1 data-copy="uiCopy.myToneTitle"></h1>

    <section class="block" id="onboarding" hidden>
      <h2 class="block-title" data-copy="onboarding.title"></h2>
      <p class="block-desc" data-copy="onboarding.desc"></p>
      <div id="onboarding-questions"></div>
      <div class="actions">
        <button type="button" class="secondary" id="onboarding-skip" data-copy="uiCopy.skip"></button>
        <button type="button" class="primary" id="onboarding-apply" disabled data-copy="uiCopy.buttons.applyOnboarding"></button>
      </div>
    </section>

    <section class="block">
      <!-- 아래 3개 문구(말투 설정 · 안내 · 피하고 싶은 표현)는 cards.json uiCopy에 없어서 여기에 둔다 -->
      <h2 class="block-title">말투 설정</h2>
      <p class="block-desc">바꾸면 바로 저장돼요. 건너뛰면 보통 · 부드럽게 · 합니다체로 만들어요.</p>
      <div id="profile-settings"></div>
      <label class="field-label" for="profile-avoid">피하고 싶은 표현 (선택)</label>
      <input type="text" id="profile-avoid" data-copy-placeholder="uiCopy.avoidPlaceholder">
    </section>

    <section class="block">
      <!-- '마음에 든 문장' 제목은 cards.json uiCopy에 없어서 여기에 둔다 -->
      <h2 class="block-title">마음에 든 문장</h2>
      <p class="block-desc" data-copy="uiCopy.favoritesDesc"></p>
      <ul class="preferred-list" id="preferred-list"></ul>
    </section>

    <p class="toast" id="profile-toast" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="secondary" data-go="home" data-copy="uiCopy.buttons.home"></button>
      <!-- '← 결과로 돌아가기'는 cards.json uiCopy에 없어서 여기에 둔다 -->
      <button type="button" class="secondary" id="profile-back-result" data-go="result" hidden>← 결과로 돌아가기</button>
      <button type="button" class="secondary" id="onboarding-reopen" data-copy="uiCopy.buttons.resetOnboarding"></button>
    </div>
  </main>

  <nav class="review-bar" id="review-bar" aria-label="검토용 화면 바로가기" hidden>
    <span>화면 바로가기</span>
  </nav>

  <script src="content.js?v=20261006-2"></script>
  <script src="engine.js?v=20261006-2"></script>
  <script src="main.js?v=20261006-2"></script>
  <script src="review.js"></script>
</body>
</html>
