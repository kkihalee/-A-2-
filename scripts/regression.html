<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>말결 회귀 테스트</title>
  <style>
    body { margin: 0 auto; max-width: 1080px; padding: 24px 20px; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.5; color: #222; }
    table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; vertical-align: top; }
    td.pre { white-space: pre-wrap; }
    .pass { color: #1a7f37; font-weight: 700; }
    .fail { color: #c62828; font-weight: 700; }
    .muted { color: #666; font-size: 14px; }
    textarea { width: 100%; height: 320px; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <!-- 내부 점검용 페이지 (앱 화면 아님). 로컬 서버로 연다: py -m http.server 8000 → http://localhost:8000/scripts/regression.html -->
  <h1>말결 회귀 테스트 (팀 피드백 10/06)</h1>
  <p class="muted">engine.js의 실제 structurize()·generateMessages()를 불러 케이스별로 PASS/FAIL을 봅니다. 외부 호출·라이브러리 없음.
    말투: 합니다체 · 부드럽게 · 보통. 받는 사람이 정해지지 않은 케이스는 선배.</p>
  <p id="status">실행 중…</p>
  <div id="summary"></div>
  <div id="detail"></div>
  <h2>결과 마크다운</h2>
  <textarea id="markdown" readonly aria-label="회귀 테스트 결과 마크다운"></textarea>

  <script>
    // engine.js는 앱에서 main.js가 넣어 주는 DATA(cards.json)·SAMPLE_DATA를 참고한다. 여기서 넣는다.
    let DATA = null;
    let SAMPLE_DATA = null;
  </script>
  <script src="../content.js"></script>
  <script src="../engine.js"></script>
  <script>
    // ---------- 공통 검사 ----------
    // ② 비문: 메시지(탭 3종 모두)에 아래 글자가 있으면 FAIL
    const BROKEN = ["서입니다", "고입니다", "는데입니다", ".을", "요를"];
    // ① 입력 유실: 입력의 내용 낱말이 어느 칸에도 없으면 FAIL
    //    받는 사람에게 묻고 싶다는 말 자체("선배한테 물어보고 싶어요")와 말끝은 내용으로 보지 않는다.
    const META_WORDS = /^(?:선배|인차지|동기|담당자|클라이언트|팀장)(?:님)?(?:한테|에게|께)?$|^(?:물어보고|여쭤보고|여쭤볼|싶어요|싶습니다|궁금해요|궁금합니다|모르겠어요|모르겠습니다|고민돼요|있어요|해요|합니다)$/;
    const ENDINGS = /(?:는데|은데|인데|지만|해서|어서|아서|와서|나서|했고|었고|았고|났고|하고|이고|에서|으로|까지|부터|이랑|에게|한테|이요|어요|아요|해요|이|가|을|를|은|는|에|의|도|로|와|과|만|요)$/;
    const noSpace = (s) => String(s || "").replace(/\s+/g, "");
    function lostWords(input, fields) {
      const all = noSpace(Object.values(fields).filter(Boolean).join(" "));
      return String(input)
        .replace(/[.,?!]/g, " ")
        .split(/\s+/)
        .filter((w) => w && !META_WORDS.test(w))
        // 부정어 '안'·'못'은 "안 맞는데" → "맞지 않음"처럼 모양이 바뀌므로, 칸에 부정 표현이 있으면 남아 있는 것으로 본다
        .filter((w) => !(/^(?:안|못)$/.test(w) && /않|안|못|없/.test(all)))
        .filter((w) => {
          let stem = w;
          for (let i = 0; i < 2 && ENDINGS.test(stem) && stem.replace(ENDINGS, "").length >= 1; i += 1) stem = stem.replace(ENDINGS, "");
          // 엔진이 연결어미를 메모체로 바꾼 모양도 같은 낱말로 본다 ("안 와서" → "안 옴", "어려워서" → "어려움")
          const memo = clauseValue(`_ ${w}`).replace(/^_ /, "");
          return stem.length >= 1 && !all.includes(stem.slice(0, 2)) && !(memo !== w && all.includes(memo.slice(0, 2)));
        });
    }

    const PROFILE = { sentenceLength: "normal", requestStyle: "soft", ending: "hamnida", avoidPhrases: "", preferredExamples: [] };
    const partner = (label) => DATA.partners.find((p) => p.label === label);
    const cardOf = (id) => DATA.cards.find((c) => c.id === id);
    const fullFields = (card, values) => Object.fromEntries(card.fields.map((f) => [f.key, values[f.key] || null]));
    const bodyOf = (text) => text.split("\n").slice(1).join("\n"); // 인사 줄(첫 줄) 제외
    const textsOf = (out) => out.variants.map((v) => v.text);
    const mineOf = (out) => out.variants.find((v) => v.type === "mine").text;

    // 검사 하나: { name, expect, actual, pass }
    const check = (name, expect, actual, pass) => ({ name, expect, actual: String(actual), pass: Boolean(pass) });
    const has = (v, s) => String(v || "").includes(s);
    function brokenCheck(out, label) {
      const hits = [];
      out.variants.forEach((v) => BROKEN.forEach((b) => v.text.includes(b) && hits.push(`${v.type}: "${b}"`)));
      return check(`② 비문${label ? ` (${label})` : ""}`, `${BROKEN.map((b) => `'${b}'`).join("·")} 없음`, hits.length ? hits.join(", ") : "없음", !hits.length);
    }
    function lostCheck(input, fields) {
      const lost = lostWords(input, fields);
      return check("① 입력 유실", "입력의 내용 낱말이 모두 어느 칸엔가 있음", lost.length ? `빠진 낱말: ${lost.join(", ")}` : "빠진 낱말 없음", !lost.length);
    }
    const showFields = (fields) =>
      Object.entries(fields)
        .filter(([, v]) => v)
        .map(([k, v]) => `${k}=${v}`)
        .join(" / ") || "(모두 빈칸)";

    // 구조화 → 메시지(받는 사람 label) 한 번에
    async function structureAndGenerate(cardId, input, label) {
      const card = cardOf(cardId);
      const s = await structurize(card, input);
      const out = await generateMessages({ card, fields: s.fields, recipient: partner(label || "선배"), profile: PROFILE, preferred: [] });
      return { card, s, out };
    }

    // 질문 준비실 기본 칸 (5·10번처럼 칸 하나만 정해진 케이스에서 나머지 칸을 채우는 고정 예시)
    const Q_BASE = {
      situation: "전기 감가상각 방법 검토 중임",
      tried: "전기 조서와 당기 계산을 비교해 봄",
      blocker: "정률법 적용 근거를 찾지 못함",
      judgment: "현재 방법을 유지해도 될 것 같음",
      ask: "이대로 진행해도 될까요?",
    };

    // ---------- 케이스 ----------
    const CASES = [
      {
        id: 1, who: "박신화", title: "status | 재고 실사는 끝났고 차이 조정 중인데 두 건이 원인을 못 찾았어요",
        run: async () => {
          const input = "재고 실사는 끝났고 차이 조정 중인데 두 건이 원인을 못 찾았어요";
          const { s, out } = await structureAndGenerate("status", input);
          return {
            fields: showFields(s.fields), message: mineOf(out),
            checks: [
              check("done", "'재고 실사' 포함", s.fields.done, has(s.fields.done, "재고 실사")),
              check("inProgress", "'차이 조정' 포함", s.fields.inProgress, has(s.fields.inProgress, "차이 조정")),
              check("blocker", "'두 건' 포함", s.fields.blocker, has(s.fields.blocker, "두 건")),
              lostCheck(input, s.fields), brokenCheck(out),
            ],
          };
        },
      },
      {
        id: 2, who: "박신화", title: "request | 오늘 중으로 끝내기 어려워서 내일 오전 10시까지로 미뤄도 될지 인차지님께 여쭤보고 싶어요",
        run: async () => {
          const input = "오늘 중으로 끝내기 어려워서 내일 오전 10시까지로 미뤄도 될지 인차지님께 여쭤보고 싶어요";
          const { s, out } = await structureAndGenerate("request", input, "인차지");
          return {
            fields: showFields(s.fields), message: mineOf(out),
            checks: [
              check("deadline", "= '내일 오전 10시까지'", s.fields.deadline, s.fields.deadline === "내일 오전 10시까지"),
              check("request", "'미뤄도 될지' 포함", s.fields.request, has(s.fields.request, "미뤄도 될지")),
              check("reason", "'어려' 포함", s.fields.reason, has(s.fields.reason, "어려")),
              lostCheck(input, s.fields), brokenCheck(out),
            ],
          };
        },
      },
      {
        id: 3, who: "박신화", title: "request | 법인카드 내역 엑셀로 금요일까지 받아야 해요",
        run: async () => {
          const input = "법인카드 내역 엑셀로 금요일까지 받아야 해요";
          const { s, out } = await structureAndGenerate("request", input);
          return {
            fields: showFields(s.fields), message: mineOf(out),
            checks: [
              check("request", "'법인카드 내역' 포함", s.fields.request, has(s.fields.request, "법인카드 내역")),
              check("deadline", "= '금요일까지'", s.fields.deadline, s.fields.deadline === "금요일까지"),
              lostCheck(input, s.fields), brokenCheck(out),
            ],
          };
        },
      },
      {
        id: 4, who: "박신화", title: "question | 매출채권 조회서 회신이 안 와서 대체적 절차로 넘어가도 되는지 궁금해요",
        run: async () => {
          const input = "매출채권 조회서 회신이 안 와서 대체적 절차로 넘어가도 되는지 궁금해요";
          const { s, out } = await structureAndGenerate("question", input, "선배");
          const hit = textsOf(out).some((t) => t.includes("와서입니다"));
          return {
            fields: showFields(s.fields), message: mineOf(out),
            checks: [check("메시지(선배)", "'와서입니다' 없음", hit ? "있음" : "없음", !hit), lostCheck(input, s.fields), brokenCheck(out)],
          };
        },
      },
      {
        id: 5, who: "박신화", title: "question | 내 판단 'A가 전기와 일관됨' (다른 칸은 고정 예시)",
        run: async () => {
          const card = cardOf("question");
          const fields = fullFields(card, { ...Q_BASE, judgment: "A가 전기와 일관됨" });
          const out = await generateMessages({ card, fields, recipient: partner("선배"), profile: PROFILE, preferred: [] });
          const bad = textsOf(out).some((t) => t.includes("일관됐"));
          const mine = mineOf(out);
          return {
            fields: showFields(fields), message: mine,
            checks: [
              check("메시지(탭 3종)", "'일관됐' 없음", bad ? "있음" : "없음", !bad),
              check("메시지(내 말투안)", "'일관된다고' 있음", has(mine, "일관된다고") ? "있음" : "없음", has(mine, "일관된다고")),
              brokenCheck(out),
            ],
          };
        },
      },
      {
        id: 6, who: "박신화", title: "question | 재고평가충당금 계산이 안 맞는데 선배한테 물어보고 싶어요 (시연 입력)",
        run: async () => {
          const input = "재고평가충당금 계산이 안 맞는데 선배한테 물어보고 싶어요";
          const { s, out } = await structureAndGenerate("question", input);
          return {
            fields: showFields(s.fields), message: mineOf(out),
            checks: [check("blocker", "비어 있음 (지어낸 값 없음)", s.fields.blocker || "(빈칸)", !s.fields.blocker), lostCheck(input, s.fields), brokenCheck(out)],
          };
        },
      },
      {
        id: 7, who: "박신화", title: "question | 리스 회계처리 모르겠어요",
        run: async () => {
          const input = "리스 회계처리 모르겠어요";
          const { s, out } = await structureAndGenerate("question", input);
          return {
            fields: showFields(s.fields), message: mineOf(out),
            checks: [
              check("blocker", "내용이 들어감", s.fields.blocker || "(빈칸)", Boolean(s.fields.blocker)),
              check("situation", "비어 있음", s.fields.situation || "(빈칸)", !s.fields.situation),
              lostCheck(input, s.fields), brokenCheck(out),
            ],
          };
        },
      },
      {
        id: 8, who: "박신화", title: "탭 차이 | 샘플 q01·r01·s01 ('내 말투안' vs '더 부드럽게' 본문)",
        run: async () => {
          const checks = [];
          const messages = [];
          for (const id of ["q01", "r01", "s01"]) {
            const sample = SAMPLE_DATA.samples.find((x) => x.id === id);
            const card = cardOf(sample.cardId);
            const out = await generateMessages({ card, fields: fullFields(card, sample.fields), recipient: partner(sample.partner), profile: PROFILE, preferred: [] });
            const mine = bodyOf(out.variants.find((v) => v.type === "mine").text);
            const soft = bodyOf(out.variants.find((v) => v.type === "soft").text);
            checks.push(check(`${id} 본문`, "'내 말투안'과 '더 부드럽게' 본문이 다름", mine === soft ? "같음" : "다름", mine !== soft));
            checks.push(brokenCheck(out, id));
            messages.push(`[${id} 더 부드럽게] ${out.variants.find((v) => v.type === "soft").text}`);
          }
          return { fields: "샘플 칸 그대로", message: messages.join("\n\n"), checks };
        },
      },
      {
        id: 9, who: "유영채", title: "question · 인차지 | 선택지가 줄바꿈 두 줄 · '맞출려면' · '회신 되지' · '진입.'",
        run: async () => {
          const card = cardOf("question");
          const options = "회신에 대해 다시 한번 요청\n3건에 대해 대체적 절차로 진입.";
          const fields = fullFields(card, {
            situation: "매출채권 조회서의 회신이 오지 않습니다",
            tried: "매출채권 조회서를 40건 발송했고 그 중 37건에 대해 회신을 받았습니다.",
            blocker: "3건이 회신 되지 않았습니다",
            options,
            judgment: "기한을 맞출려면 대체적 절차로 진입해야 할 것 같습니다.",
            ask: "대체적 절차로 넘어가야 할까요?",
          });
          const out = await generateMessages({ card, fields, recipient: partner("인차지"), profile: PROFILE, preferred: [] });
          const texts = textsOf(out);
          const mine = mineOf(out);
          const rawOption = texts.some((t) => t.includes(options) || t.includes("요청\n3건"));
          const oneSentence = (has(mine, "①") && has(mine, "②")) || /와 .+ 중/.test(mine) || /과 .+ 중/.test(mine);
          const midJinip = texts.some((t) => /진입\.(?:[^\s]|\s*(?:입니다|이에요|이야|중|와|과))/.test(t));
          const yesNo = (b) => (b ? "있음" : "없음");
          return {
            fields: showFields(fields).replace(/\n/g, "⏎"), message: mine,
            checks: [
              check("선택지 원문", "줄바꿈으로 붙은 선택지 원문 없음 (탭 3종)", yesNo(rawOption), !rawOption),
              check("선택지 정리", "한 문장 안에 '①'·'②' 또는 '~와 ~ 중' (내 말투안)", oneSentence ? "정리됨" : "정리 안 됨", oneSentence),
              check("맞춤법", "'맞출려면' 없음 (탭 3종)", yesNo(texts.some((t) => t.includes("맞출려면"))), !texts.some((t) => t.includes("맞출려면"))),
              check("맞춤법", "'맞추려면' 있음 (내 말투안)", yesNo(has(mine, "맞추려면")), has(mine, "맞추려면")),
              check("띄어쓰기", "'회신 되지' 없음 (탭 3종)", yesNo(texts.some((t) => t.includes("회신 되지"))), !texts.some((t) => t.includes("회신 되지"))),
              check("띄어쓰기", "'회신되지' 있음 (내 말투안)", yesNo(has(mine, "회신되지")), has(mine, "회신되지")),
              check("문장부호", "문장 중간의 '진입.' 없음 (탭 3종)", yesNo(midJinip), !midJinip),
              brokenCheck(out),
            ],
          };
        },
      },
      {
        id: 10, who: "유영채", title: "question · 인차지/선배/클라이언트(+동기) | 막힌 지점 '일정이 너무 빡세서 기한을 못 맞출 것 같아요'",
        run: async () => {
          const card = cardOf("question");
          const fields = fullFields(card, { ...Q_BASE, blocker: "일정이 너무 빡세서 기한을 못 맞출 것 같아요" });
          const checks = [];
          const messages = [];
          for (const label of ["인차지", "선배", "클라이언트", "동기"]) {
            const out = await generateMessages({ card, fields, recipient: partner(label), profile: PROFILE, preferred: [] });
            const hit = textsOf(out).some((t) => t.includes("빡세"));
            if (label === "동기") {
              checks.push(check("동기 메시지", "'빡세' 허용 (검사 안 함)", hit ? "있음" : "없음", true));
            } else {
              checks.push(check(`${label} 메시지`, "'빡세' 없음 (탭 3종)", hit ? "있음" : "없음", !hit));
              const reasons = out.variants.flatMap((v) => v.reasons || []).join(" / ");
              checks.push(check(`${label} 수정 이유`, "바꾼 표현('빡세')이 언급됨", reasons, reasons.includes("빡세")));
            }
            checks.push(brokenCheck(out, label));
            messages.push(`[${label}] ${mineOf(out)}`);
          }
          return { fields: showFields(fields), message: messages.join("\n\n"), checks };
        },
      },
    ];

    // ---------- 실행 · 표 ----------
    const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const mdCell = (s) => String(s).replace(/\|/g, "\\|").replace(/\n/g, "⏎");

    (async () => {
      const status = document.getElementById("status");
      try {
        [DATA, SAMPLE_DATA] = await Promise.all([
          fetch("../data/cards.json", { cache: "no-cache" }).then((r) => r.json()),
          fetch("../data/malgyeol_sample_data.json", { cache: "no-cache" }).then((r) => r.json()),
        ]);
        const results = [];
        for (const c of CASES) {
          let r;
          try {
            r = await c.run();
          } catch (error) {
            r = { fields: "", message: "", checks: [check("실행", "오류 없이 실행", error.message, false)] };
          }
          results.push({ ...c, ...r, pass: r.checks.every((x) => x.pass) });
        }
        const passCount = results.filter((r) => r.pass).length;

        document.getElementById("summary").innerHTML =
          `<p><strong>케이스 ${passCount} / ${results.length} PASS</strong></p>` +
          "<table><tr><th>#</th><th>제보</th><th>케이스</th><th>결과</th><th>실패한 검사</th></tr>" +
          results
            .map((r) => `<tr><td>${r.id}</td><td>${r.who}</td><td>${escapeHtml(r.title)}</td><td class="${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"}</td><td>${escapeHtml(r.checks.filter((x) => !x.pass).map((x) => `${x.name}: ${x.expect}`).join(" · ") || "-")}</td></tr>`)
            .join("") +
          "</table>";
        document.getElementById("detail").innerHTML = results
          .map(
            (r) =>
              `<h3>${r.id}. ${escapeHtml(r.title)} — <span class="${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"}</span></h3>` +
              `<p class="muted">칸: ${escapeHtml(r.fields)}</p>` +
              "<table><tr><th>검사</th><th>기대</th><th>실제</th><th>결과</th></tr>" +
              r.checks.map((x) => `<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.expect)}</td><td class="pre">${escapeHtml(x.actual)}</td><td class="${x.pass ? "pass" : "fail"}">${x.pass ? "PASS" : "FAIL"}</td></tr>`).join("") +
              `</table><p class="muted">메시지(내 말투안):</p><table><tr><td class="pre">${escapeHtml(r.message)}</td></tr></table>`,
          )
          .join("");

        const now = new Date();
        const date = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`; // 내 PC 날짜 기준
        const md = [`# 말결 회귀 테스트 (${date})`, "", `- 방법: \`scripts/regression.html\`(브라우저)에서 \`engine.js\`의 structurize()·generateMessages()를 그대로 실행`, `- 말투: 합니다체 · 부드럽게 · 보통 · 받는 사람이 정해지지 않은 케이스는 선배`, `- 공통 검사: ① 입력 유실(입력의 내용 낱말이 어느 칸에도 없음 · 구조화 케이스만) ② 비문(${BROKEN.map((b) => `'${b}'`).join("·")} · 탭 3종)`, "", `## 요약: 케이스 ${passCount} / ${results.length} PASS`, "", "| # | 제보 | 케이스 | 결과 | 실패한 검사 |", "|---|---|---|---|---|"];
        results.forEach((r) => md.push(`| ${r.id} | ${r.who} | ${mdCell(r.title)} | ${r.pass ? "PASS" : "**FAIL**"} | ${mdCell(r.checks.filter((x) => !x.pass).map((x) => `${x.name}: ${x.expect}`).join(" · ") || "-")} |`));
        md.push("", "## 케이스별 상세", "");
        results.forEach((r) => {
          md.push(`### ${r.id}. ${r.title} — ${r.pass ? "PASS" : "FAIL"}`, "", `- 칸: ${r.fields}`, "", "| 검사 | 기대 | 실제 | 결과 |", "|---|---|---|---|");
          r.checks.forEach((x) => md.push(`| ${mdCell(x.name)} | ${mdCell(x.expect)} | ${mdCell(x.actual)} | ${x.pass ? "PASS" : "FAIL"} |`));
          md.push("", "```", r.message, "```", "");
        });
        document.getElementById("markdown").value = md.join("\n");
        status.textContent = `완료 · 케이스 ${passCount} / ${results.length} PASS`;
        window.REGRESSION = { results, passCount, markdown: md.join("\n") };
      } catch (error) {
        status.textContent = "실행하지 못했어요. 로컬 서버로 열었는지 확인해 주세요. (" + error.message + ")";
        console.error(error);
      }
    })();
  </script>
</body>
</html>
